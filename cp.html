<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>しるし｜しろへびさんぽ</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="./js/checkpoints.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; overflow:hidden; touch-action:none;
         background:#0f2417; color:#f6f6f2;
         font-family:"Hiragino Sans","Noto Sans JP",sans-serif; }

  rt { font-size:0.5em; font-weight:normal; }

  /* クイズ画面（背景は透明。中身のカードだけ半透明） */
  #quizBox { position:relative; z-index:10; min-height:100vh; display:flex;
             flex-direction:column; justify-content:center; padding:22px;
             overflow-y:auto; background:transparent; }
  #card { background:rgba(15,36,23,.86); border-radius:16px; padding:20px 18px;
          max-width:520px; margin:0 auto; width:100%;
          box-shadow:0 8px 28px rgba(0,0,0,.35); }
  #place { font-size:13px; letter-spacing:.15em; opacity:.75; line-height:2; }
  h1 { font-size:22px; margin:6px 0 18px; line-height:2; }
  #quiz { font-size:16px; line-height:2.2; margin-bottom:16px; white-space:pre-line; }
  .choice { display:block; width:100%; margin-bottom:10px; padding:13px;
            border:1px solid rgba(255,255,255,.4); border-radius:12px;
            background:rgba(255,255,255,.08); color:#f6f6f2; font-size:16px;
            line-height:2; }
  #ng { font-size:14px; color:#ffd9d9; min-height:1.6em; line-height:2; }

  /* カメラ映像とARシーン */
  #cam { position:fixed; inset:0; width:100%; height:100%;
         object-fit:cover; z-index:0; background:#0f2417; }
  #scrim { position:fixed; inset:0; z-index:1; background:rgba(8,20,14,.45); }
  a-scene { position:fixed !important; inset:0; z-index:5;
            opacity:0; pointer-events:none; transition:opacity .5s; }
  a-scene.on { opacity:1; }
  .a-enter-vr, .a-enter-ar { display:none !important; }

  #talk { display:none; position:fixed; left:0; right:0; bottom:0; z-index:20;
          padding:20px 18px 30px; text-align:center; }
  #talk .panel { background:rgba(15,36,23,.88); border-radius:14px;
                 padding:16px 18px; margin:0 auto; max-width:520px; }
  #voice { font-size:17px; line-height:2.2; margin:0 0 6px; color:#fffdf5; }
  #progress { font-size:13px; opacity:.85; margin:0; color:#fffdf5; }
  .btn { display:inline-block; margin-top:16px; padding:14px 34px; border:none;
         border-radius:999px; background:#f6f6f2; color:#0f2417;
         font-size:16px; font-weight:bold; text-decoration:none; line-height:2; }

  /* キラキラ */
  #sparkle { position:fixed; inset:0; pointer-events:none; z-index:40; display:none; }
  #sparkle span { position:absolute; width:10px; height:10px; border-radius:50%;
    animation: pop 1.4s ease-out forwards; }
  @keyframes pop {
    0%   { transform:scale(0) translateY(0); opacity:0; }
    30%  { transform:scale(1.3) translateY(-10px); opacity:1; }
    100% { transform:scale(0.2) translateY(-70px); opacity:0; }
  }
  #flash { position:fixed; inset:0; z-index:39; background:#fff; opacity:0;
           pointer-events:none; transition:opacity .35s; }
</style>
</head>
<body>

<video id="cam" autoplay muted playsinline></video>
<div id="scrim"></div>

<a-scene id="scene" embedded vr-mode-ui="enabled: false"
         device-orientation-permission-ui="enabled: false"
         renderer="colorManagement: true; antialias: true; alpha: true; logarithmicDepthBuffer: true"
         background="transparent: true">
  <a-assets>
    <a-asset-item id="snakeModel" src="./models/shirohebi.glb"></a-asset-item>
  </a-assets>

  <a-entity light="type: hemisphere; color:#ffffff; groundColor:#b9c3bb; intensity:0.35"></a-entity>
  <a-entity light="type: ambient; color:#ffffff; intensity:0.15"></a-entity>
  <a-entity light="type: directional; color:#fff6e8; intensity:1.0" position="1.5 3 2"></a-entity>
  <a-entity light="type: directional; color:#dce8ff; intensity:0.3" position="-2 0.5 1"></a-entity>

  <!-- 向いている方向に白蛇を出すための台 -->
  <a-entity id="pivot">
    <!-- 足元から広がる光の輪 -->
    <a-ring id="halo" position="0 0.1 -2.2" rotation="-90 0 0"
            radius-inner="0.1" radius-outer="0.5" visible="false"
            material="shader: flat; side: double; transparent: true; opacity: 0"></a-ring>

    <a-entity id="snake" gltf-model="#snakeModel"
              position="0 0.9 -2.2" scale="1.2 1.2 1.2" visible="false"></a-entity>
  </a-entity>

  <a-entity camera="near: 0.1" position="0 1.5 0"
            look-controls="magicWindowTrackingEnabled: true; touchEnabled: false; mouseEnabled: false"></a-entity>
</a-scene>

<div id="quizBox">
  <div id="card">
    <div id="place"></div>
    <h1 id="name"></h1>
    <div id="quiz"></div>
    <div id="choices"></div>
    <div id="ng"></div>
  </div>
</div>

<div id="talk">
  <div class="panel">
    <h1 id="doneName" style="font-size:20px; margin:0 0 10px;"></h1>
    <p id="voice"></p>
    <p id="progress"></p>
  </div>
  <a class="btn" href="walk.html">さんぽに<ruby>戻<rt>もど</rt></ruby>る</a>
</div>

<div id="flash"></div>
<div id="sparkle"></div>

<script>
/* ===== 調整用の設定 ===== */
const SNAKE_POS    = '0 0.9 -2.2';
const SNAKE_BOUNCE = '0 1.1 -2.2';
let   SNAKE_SCALE  = 1.2;

const id = Number(new URLSearchParams(location.search).get('id') || 1);
const cp = CP_LIST.find(c => c.id === id) || CP_LIST[0];
const glow = cp.glow || '#ffffff';

document.getElementById('place').innerHTML = cp.place;
document.getElementById('name').innerHTML  = cp.name;
document.getElementById('quiz').innerHTML  = cp.quiz;

/* ===== 背景を透明にしてカメラ映像を見せる ===== */
const sceneEl = document.getElementById('scene');
function clearBg() {
  if (sceneEl.renderer) sceneEl.renderer.setClearAlpha(0);
}
sceneEl.addEventListener('loaded', clearBg);
sceneEl.addEventListener('renderstart', clearBg);

/* ===== 効果音 ===== */
const SE = {
  correct: new Audio('./audio/correct.mp3'),
  stamp:   new Audio('./audio/stamp.mp3')
};
Object.values(SE).forEach(a => a.volume = 0.6);

function se(name) {
  const a = SE[name];
  if (!a) return;
  a.currentTime = 0;
  a.play().catch(() => {});
}

/* ===== キラキラ ===== */
function sparkle() {
  const box = document.getElementById('sparkle');
  box.innerHTML = '';
  box.style.display = 'block';
  for (let i = 0; i < 34; i++) {
    const s = document.createElement('span');
    s.style.left = (8 + Math.random() * 84) + '%';
    s.style.top  = (15 + Math.random() * 60) + '%';
    s.style.background = glow;
    s.style.boxShadow = '0 0 14px 5px ' + glow;
    s.style.animationDelay = (Math.random() * 0.6) + 's';
    box.appendChild(s);
  }
  setTimeout(() => { box.style.display = 'none'; }, 2400);
}

/* ===== カメラ（二度目以降は何もしない） ===== */
let camStarted = false;
async function startCamera() {
  if (camStarted) return;
  camStarted = true;
  try {
    const st = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' } }, audio: false
    });
    document.getElementById('cam').srcObject = st;
  } catch (e) {
    camStarted = false;
    console.log('camera denied', e);   // 濃緑の背景のまま進む
  }
}

/* ===== 白蛇の登場 ===== */
function showSnake() {
  document.getElementById('scrim').style.display = 'none';   // 膜を外して白蛇をはっきり
  sceneEl.classList.add('on');
  clearBg();
  window.dispatchEvent(new Event('resize'));   // 描画サイズを取り直す

  // いまカメラが向いている方向に台を回す
  const pivot = document.getElementById('pivot');
  const camEl = document.querySelector('[camera]');
  if (pivot && camEl) pivot.object3D.rotation.y = camEl.object3D.rotation.y;

  const halo = document.getElementById('halo');
  halo.setAttribute('visible', true);
  halo.setAttribute('material',
    'shader: flat; side: double; transparent: true; opacity: 0.85; color: ' + glow);
  halo.setAttribute('animation__grow',
    'property: geometry.radiusOuter; from: 0.2; to: 1.6; dur: 1400; easing: easeOutQuad');
  halo.setAttribute('animation__fade',
    'property: material.opacity; from: 0.85; to: 0; dur: 1400; easing: easeOutQuad');

  setTimeout(() => {
    const sn = document.getElementById('snake');
    sn.setAttribute('visible', true);
    sn.setAttribute('animation__pop',
      'property: scale; from: 0.001 0.001 0.001; ' +
      'to: ' + SNAKE_SCALE + ' ' + SNAKE_SCALE + ' ' + SNAKE_SCALE + '; ' +
      'dur: 900; easing: easeOutBack');
    setTimeout(() => {
      sn.setAttribute('animation__bounce',
        'property: position; from: ' + SNAKE_POS + '; to: ' + SNAKE_BOUNCE +
        '; dur: 900; dir: alternate; loop: true; easing: easeInOutQuad');
      sn.setAttribute('animation__sway',
        'property: rotation; from: 0 -12 0; to: 0 12 0; ' +
        'dur: 2400; dir: alternate; loop: true; easing: easeInOutSine');
    }, 900);
  }, 350);
}

/* ===== 正解したとき ===== */
function unlock(silent) {
  Stamp.add(cp.id);
  document.getElementById('quizBox').style.display = 'none';
  document.getElementById('doneName').innerHTML =
    cp.name + ' を<ruby>手<rt>て</rt></ruby>に<ruby>入<rt>い</rt></ruby>れた！';
  document.getElementById('voice').innerHTML = '「' + cp.voice + '」';
  document.getElementById('progress').innerHTML =
    'しるし ' + Stamp.count() + ' / ' + CP_LIST.length;

  startCamera();

  if (silent) {
    showSnake();
    document.getElementById('talk').style.display = 'block';
    return;
  }

  const flash = document.getElementById('flash');
  flash.style.opacity = '.9';
  se('correct');
  sparkle();
  setTimeout(() => se('stamp'), 600);
  setTimeout(() => { flash.style.opacity = '0'; }, 400);
  setTimeout(showSnake, 500);
  setTimeout(() => { document.getElementById('talk').style.display = 'block'; }, 1800);
}

// すでに獲得済みなら演出なしで表示
if (Stamp.has(cp.id)) unlock(true);

cp.choices.forEach((c, i) => {
  const b = document.createElement('button');
  b.className = 'choice';
  b.innerHTML = c;
  b.onclick = () => {
    if (i === cp.answer) unlock(false);
    else document.getElementById('ng').innerHTML =
      'うーん、ちがうみたい。' +
      (cp.hint ? '「' + cp.hint + '」' : 'もう<ruby>一度<rt>いちど</rt></ruby>よく<ruby>見<rt>み</rt></ruby>てみて。');
  };
  document.getElementById('choices').appendChild(b);
});

/* ===== ピンチで白蛇の大きさを変える ===== */
const MIN_SCALE = 0.15, MAX_SCALE = 4;
let pinchStartDist = 0, pinchStartScale = 0;
const snake = document.getElementById('snake');

function dist(t) {
  return Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
}
function applyScale() {
  snake.setAttribute('scale', SNAKE_SCALE + ' ' + SNAKE_SCALE + ' ' + SNAKE_SCALE);
}

document.addEventListener('touchstart', e => {
  if (e.touches.length === 2) {
    pinchStartDist  = dist(e.touches);
    pinchStartScale = SNAKE_SCALE;
  }
}, { passive: false });

document.addEventListener('touchmove', e => {
  if (e.touches.length === 2 && pinchStartDist > 0) {
    e.preventDefault();
    const ratio = dist(e.touches) / pinchStartDist;
    SNAKE_SCALE = Math.min(Math.max(pinchStartScale * ratio, MIN_SCALE), MAX_SCALE);
    applyScale();
  }
}, { passive: false });

document.addEventListener('touchend', () => { pinchStartDist = 0; });

document.addEventListener('wheel', e => {
  if (!snake.getAttribute('visible')) return;
  e.preventDefault();
  SNAKE_SCALE = Math.min(Math.max(SNAKE_SCALE * (e.deltaY < 0 ? 1.06 : 0.94), MIN_SCALE), MAX_SCALE);
  applyScale();
}, { passive: false });

/* ===== 最初からカメラを映す ===== */
startCamera();
</script>
</body>
</html>
