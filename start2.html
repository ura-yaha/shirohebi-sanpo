<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>出会い｜しろへびさんぽ</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      touch-action: none;
      font-family: "Hiragino Sans", "Noto Sans JP", sans-serif;
    }

    #cam {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      background: #0f2417;
    }

    a-scene {
      position: fixed !important;
      inset: 0;
      z-index: 1;
    }

    .a-enter-vr,
    .a-enter-ar {
      display: none !important;
    }

    /* ── 冒頭の呼び声 ── */
    #callScene {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 30px;
      background: #0b1a12;
      color: #f6f6f2;
      text-align: center;
    }

    #callLine {
      font-size: 24px;
      line-height: 2;
      opacity: 0;
      transition: opacity 1s;
      font-family: "Hiragino Mincho ProN", serif;
    }

    #callLine.show {
      opacity: 1;
    }

    #callSub {
      font-size: 20px;
      opacity: 0;
      transition: opacity 1s;
    }

    #callSub.show {
      opacity: .75;
    }

    #callBtn {
      opacity: 0;
      transition: opacity .8s;
      pointer-events: none;
    }

    #callBtn.show {
      opacity: 1;
      pointer-events: auto;
    }

    .btn {
      padding: 13px 32px;
      border: none;
      border-radius: 999px;
      background: #f6f6f2;
      color: #0f2417;
      font-size: 16px;
      font-weight: bold;
    }

    /* ── 登場のキラキラ ── */
    #sparkle {
      position: fixed;
      inset: 0;
      z-index: 40;
      pointer-events: none;
      display: none;
    }

    #sparkle .flash {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 45%, rgba(255, 255, 240, .95), rgba(255, 255, 240, 0) 60%);
      animation: flash 1.6s ease-out forwards;
    }

    #sparkle i {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #fffbe6;
      box-shadow: 0 0 12px 4px rgba(255, 250, 200, .9);
      animation: spark 1.6s ease-out forwards;
    }

    @keyframes flash {
      0% {
        opacity: 0
      }

      25% {
        opacity: 1
      }

      100% {
        opacity: 0
      }
    }

    @keyframes spark {
      0% {
        transform: translate(0, 0) scale(.3);
        opacity: 0;
      }

      30% {
        opacity: 1;
      }

      100% {
        transform: translate(var(--dx), var(--dy)) scale(1.1);
        opacity: 0;
      }
    }

    /* ── 会話UI ── */
    #hud {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 20;
      padding: 10px 14px 16px;
      text-align: center;
      color: #fffdf5;
    }

    #hint {
      font-size: 20px;
      line-height: 1.7;
      font-weight: 600;
      background: rgba(15, 36, 23, .88);
      border-radius: 12px;
      padding: 12px 16px;
      max-width: 520px;
      margin: 0 auto;
    }

    #talk {
      display: none;
    }

    #panel {
      background: rgba(15, 36, 23, .88);
      border-radius: 14px;
      padding: 12px 14px 10px;
      max-width: 520px;
      margin: 0 auto 10px;
    }

    #line {
      font-size: 20px;
      line-height: 2.2;
      margin: 0 0 10px;
      min-height: 4.5em;
      font-weight: 600;
      color: #fffdf5;
      text-align: center;
      display: block;
      padding: 8px 0;
    }

    rt {
      font-size: 0.5em;
      font-weight: normal;
    }


    #goalPic {
      display: none;
      width: 40%;
      max-width: 130px;
      margin: 0 auto 10px;
      border: 3px solid #f6f6f2;
      border-radius: 6px;
    }
  </style>
</head>

<body>

  <!-- ① 呼び声の画面 -->
  <div id="callScene">
    <div id="callLine">「おーい、こっちこっち！<br>おいらが<ruby>見<rt>み</rt></ruby>える？？」</div>
    <div id="callSub">…<ruby>誰<rt>だれ</rt></ruby>かが<ruby>呼<rt>よ</rt></ruby>んでいるようだ。</div>
    <button class="btn" id="callBtn"><ruby>声<rt>こえ</rt></ruby>の<ruby>主<rt>ぬし</rt></ruby>を<ruby>探<rt>さが</rt>
        </ruby>してみる</button>
  </div>

  <!-- ② 登場エフェクト -->
  <div id="sparkle">
    <div class="flash"></div>
  </div>

  <video id="cam" autoplay muted playsinline></video>

  <!-- ③ 会話UI -->
  <div id="hud">
    <div id="hint">ゆっくり<ruby>見<rt>み</rt></ruby>まわしてください</div>
    <div id="talk">
      <div id="panel">
        <p id="line"></p>
        <img id="goalPic" alt="めじるし">
      </div>
      <button class="btn" id="next" style="margin-top:10px">つぎへ</button>
    </div>
  </div>

  <a-scene embedded
    renderer="colorManagement: true; physicallyCorrectLights: false; antialias: true; alpha: true; logarithmicDepthBuffer: true"
    vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" background="transparent: true">

    <a-assets>
      <a-asset-item id="snakeModel" src="./models/shirohebi.glb"></a-asset-item>
    </a-assets>

    <a-entity light="type: hemisphere; color:#ffffff; groundColor:#b9c3bb; intensity:0.35"></a-entity>
    <a-entity light="type: ambient; color:#ffffff; intensity:0.15"></a-entity>
    <a-entity light="type: directional; color:#fff6e8; intensity:1.0" position="1.5 3 2"></a-entity>
    <a-entity light="type: directional; color:#dce8ff; intensity:0.3" position="-2 0.5 1"></a-entity>

    <a-entity camera look-controls="magicWindowTrackingEnabled: true; touchEnabled: false; mouseEnabled: false"
      position="0 1.5 0"></a-entity>

    <a-entity id="pivot">
      <a-entity id="snake" gltf-model="#snakeModel" position="0 0.9 -2.2" rotation="0 0 0" scale="0.001 0.001 0.001"
        visible="false"></a-entity>
    </a-entity>
  </a-scene>

  <script>
    /* ===== バッジから来たかどうか ===== */
    const fromBadge = new URLSearchParams(location.search).get('from') === 'badge';

    if (fromBadge) {
      document.getElementById('callLine').innerHTML =
        '「さっきは おどろいた？<br>こんどは そとで まってるよ！」';
      document.getElementById('callSub').innerHTML =
        'あの<ruby>白蛇<rt>しろへび</rt></ruby>が、どこかで<ruby>呼<rt>よ</rt></ruby>んでいる。';
      document.getElementById('callBtn').innerHTML =
        'あたりを <ruby>見<rt>み</rt></ruby>まわす';
    }

    /* ===== 調整用の設定 ===== */
    const SNAKE_POS = '0 0.9 -2.2';
    const SNAKE_BOUNCE = '0 1.1 -2.2';
    let SNAKE_SCALE = 1.2;

    /* ===== 背景を透明にしてカメラ映像を見せる ===== */
    const sceneEl = document.querySelector('a-scene');
    function clearBg() {
      if (sceneEl.renderer) sceneEl.renderer.setClearAlpha(0);
    }
    sceneEl.addEventListener('loaded', clearBg);
    sceneEl.addEventListener('renderstart', clearBg);

    /* ===== チェックポイント（将来ここに追記するだけで増える） ===== */
    const CHECKPOINTS = [
    ];

    /* ===== 白蛇のセリフ ===== */
    const lines = [
      { text: 'よくぞ来た。<br>おいらは、この靭の地に<br>すむ白蛇。' },
      { text: '神社までおいらを<br>送ってくれないか？' },
      { text: '送ってくれたら、心ばかりの<br>お礼をさせてもらうよ♪' },
      { text: 'ただ帰るだけじゃつまらない。<br>せっかくだから<br>３つのチェックポイントを<br>めぐってみてよ。' },
      { text: 'ひとつめは、この石。<br>バラのお庭のそばだよ。', pic: './img/cp1.jpg' },
      { text: 'ふたつめは、ここ。<br>日とけいのあるひろばの<br>あたりにあるよ。', pic: './img/cp2.jpg' },
      { text: 'みっつめは、公園のはしっこ。<br>小さな塔がたってる。', pic: './img/cp3.jpg' },
      { text: 'この３つを見つけたあとは<br>おいらの帰る木へ。<br>この鳥居が目印だぞ', pic: './img/goal_target.jpg' },
      { text: 'もし道に迷ったら<br>画面の下を見て。<br>つぎのしるしまで、<br>あと何メートルか<br>教えてあげるね。' }
    ];

    if (fromBadge) {
      lines[0].text = 'あらためて。<br>おいらは、この靭の地に<br>すむ白蛇。';
    }

    if (CHECKPOINTS.length > 0) {
      const list = CHECKPOINTS.map(c => c.hint).join('、');
      lines.splice(lines.length - 1, 0, {
        text: 'それと、途中に ' + CHECKPOINTS.length + ' つ、寄ってほしい場所があるんだ。' + list + '。よろしくね。'
      });
    }
    localStorage.setItem('shirohebi_checkpoints', JSON.stringify(CHECKPOINTS));

    /* ===== 効果音 ===== */
    const SE = {
      appear: new Audio('./audio/appear.mp3'),
      tap: new Audio('./audio/tap.mp3')
    };
    Object.values(SE).forEach(a => a.volume = 0.6);
    SE.tap.volume = 0.35;

    function se(name) {
      const a = SE[name];
      if (!a) return;
      a.currentTime = 0;
      a.play().catch(() => { });
    }

    /* ===== ① 呼び声の演出 ===== */
    const callLine = document.getElementById('callLine');
    const callSub = document.getElementById('callSub');
    const callBtn = document.getElementById('callBtn');

    setTimeout(() => callLine.classList.add('show'), 400);
    setTimeout(() => callSub.classList.add('show'), 3200);
    setTimeout(() => callBtn.classList.add('show'), 4600);

    /* ===== ② キラキラ登場 ===== */
    function burst() {
      const pivot = document.getElementById('pivot');
      const camEl = document.querySelector('[camera]');
      pivot.object3D.rotation.y = camEl.object3D.rotation.y;

      const box = document.getElementById('sparkle');
      box.style.display = 'block';

      for (let i = 0; i < 26; i++) {
        const s = document.createElement('i');
        const a = Math.random() * Math.PI * 2;
        const d = 90 + Math.random() * 190;
        s.style.left = '50%';
        s.style.top = '45%';
        s.style.setProperty('--dx', Math.cos(a) * d + 'px');
        s.style.setProperty('--dy', Math.sin(a) * d + 'px');
        s.style.animationDelay = (Math.random() * 0.35) + 's';
        box.appendChild(s);
      }
      setTimeout(() => {
        box.style.display = 'none';
        box.querySelectorAll('i').forEach(e => e.remove());
      }, 2200);
    }

    /* ===== ③ 会話 ===== */
    let li = 0;
    const hint = document.getElementById('hint');
    const talk = document.getElementById('talk');
    const lineEl = document.getElementById('line');
    const goalPic = document.getElementById('goalPic');
    const next = document.getElementById('next');
    const snake = document.getElementById('snake');

    const RUBY = {
      '途中': 'とちゅう',
      '寄': 'よ',
      '小': 'ちい',
      '見': 'み',
      '来': 'き',
      '地': 'ち',
      '送': 'おく',
      '心': 'こころ',
      '礼': 'れい',
      '庭': 'にわ',
      '木': 'き',
      '日': 'ひ',
      '何': 'なん',
      '教': 'おし',
      '靭': 'うつぼ',
      '帰': 'かえ',
      '白蛇': 'しろへび',
      '神社': 'じんじゃ',
      '鳥居': 'とりい',
      '目印': 'めじるし',
      '石': 'いし',
      '塔': 'とう',
      '公園': 'こうえん',
      '画面': 'がめん',
      '道': 'みち'
    };

    function addRuby(s) {
      Object.keys(RUBY).sort((a, b) => b.length - a.length).forEach(k => {
        s = s.split(k).join(`<ruby>${k}<rt>${RUBY[k]}</rt></ruby>`);
      });
      return s;
    }

    function renderLine() {
      const l = lines[li];
      lineEl.innerHTML = addRuby(l.text);
      if (l.pic) { goalPic.src = l.pic; goalPic.style.display = 'block'; }
      else { goalPic.style.display = 'none'; }
      next.textContent = (li === lines.length - 1) ? 'さんぽへ出発' : 'つぎへ';
    }

    function applyScale() {
      snake.setAttribute('scale', SNAKE_SCALE + ' ' + SNAKE_SCALE + ' ' + SNAKE_SCALE);
    }

    callBtn.addEventListener('click', async () => {
      // iOS はタップの中でジャイロ許可を取る
      try {
        if (typeof DeviceOrientationEvent !== 'undefined' &&
          typeof DeviceOrientationEvent.requestPermission === 'function') {
          await DeviceOrientationEvent.requestPermission();
        }
      } catch (e) { console.log('orientation skip', e); }

      // 背面カメラ。拒否されても話は進める
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' } }, audio: false
        });
        document.getElementById('cam').srcObject = stream;
      } catch (e) { console.log('camera denied', e); }

      clearBg();
      document.getElementById('callScene').style.display = 'none';

      // 少し探す間をおいて → キラキラ → 白蛇登場
      setTimeout(() => { burst(); se('appear'); }, 900);
      setTimeout(() => {
        clearBg();
        snake.setAttribute('visible', true);
        snake.setAttribute('animation__pop',
          'property: scale; from: 0.001 0.001 0.001; ' +
          'to: ' + SNAKE_SCALE + ' ' + SNAKE_SCALE + ' ' + SNAKE_SCALE + '; ' +
          'dur: 900; easing: easeOutBack');
      }, 1250);

      // 登場が終わってから、ゆれ・跳ね・会話をはじめる
      setTimeout(() => {
        snake.setAttribute('animation__bounce',
          'property: position; from: ' + SNAKE_POS + '; to: ' + SNAKE_BOUNCE +
          '; dur: 900; dir: alternate; loop: true; easing: easeInOutQuad');
        snake.setAttribute('animation__sway',
          'property: rotation; from: 0 -12 0; to: 0 12 0; ' +
          'dur: 2400; dir: alternate; loop: true; easing: easeInOutSine');
        hint.style.display = 'none';
        talk.style.display = 'block';
        localStorage.setItem('shirohebi_step', 'start_done');
        renderLine();
      }, 2300);
    });

    next.addEventListener('click', () => {
      se('tap');
      if (li < lines.length - 1) { li++; renderLine(); }
      else { location.href = 'walk.html'; }
    });

    /* ===== ピンチで白蛇の大きさを変える ===== */
    const MIN_SCALE = 0.15, MAX_SCALE = 4;
    let pinchStartDist = 0, pinchStartScale = 0;

    function dist(t) {
      return Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
    }

    document.addEventListener('touchstart', e => {
      if (e.touches.length === 2) {
        pinchStartDist = dist(e.touches);
        pinchStartScale = SNAKE_SCALE;
      }
    }, { passive: false });

    document.addEventListener('touchmove', e => {
      if (e.touches.length === 2 && pinchStartDist > 0) {
        e.preventDefault();
        const ratio = dist(e.touches) / pinchStartDist;
        SNAKE_SCALE = Math.min(Math.max(pinchStartScale * ratio, MIN_SCALE), MAX_SCALE);
        applyScale();
      }
    }, { passive: false });

    document.addEventListener('touchend', () => { pinchStartDist = 0; });

    /* PCでの確認用：マウスホイールでも同じ操作ができる */
    document.addEventListener('wheel', e => {
      if (!snake.getAttribute('visible')) return;
      e.preventDefault();
      SNAKE_SCALE = Math.min(Math.max(SNAKE_SCALE * (e.deltaY < 0 ? 1.06 : 0.94), MIN_SCALE), MAX_SCALE);
      applyScale();
    }, { passive: false });
  </script>
</body>

</html>
