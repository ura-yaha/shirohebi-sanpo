<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>大復活 | しろへびさんぽ</title>
  <script src="./js/checkpoints.js"></script>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.7.0/dist/aframe-extras.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      font-family: "Hiragino Sans", "Noto Sans JP", sans-serif;
    }

    rt {
      font-size: 0.5em;
      font-weight: normal;
    }

    .mindar-ui-overlay {
      display: none !important;
    }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 20px;
      text-align: center;
    }

    .overlay.hidden {
      display: none;
    }

    #scanUI {
      background: rgba(0, 0, 0, .35);
      color: #fffdf5;
    }

    #scanUI p {
      background: rgba(15, 36, 23, .88);
      border-radius: 12px;
      padding: 12px 16px;
      max-width: 520px;
      margin: 0 auto;
      font-weight: 600;
      line-height: 2;
    }

    .scan-frame {
      width: 62vw;
      max-width: 300px;
      aspect-ratio: 1;
      border: 3px dashed rgba(255, 255, 255, .85);
      border-radius: 12px;
    }

    #finale {
      background: rgba(255, 255, 255, .95);
      color: #14432f;
      overflow-y: auto;
    }

    #finale h2 {
      font-size: 20px;
      margin: 0 0 6px;
      line-height: 1.8;
    }

    .note {
      font-size: 13px;
      line-height: 2.1;
      opacity: .9;
      margin: 0;
    }

    .btn {
      display: inline-block;
      padding: 15px 28px;
      border: none;
      border-radius: 999px;
      background: #e2536e;
      color: #fff;
      font-size: 17px;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 6px 16px rgba(0, 0, 0, .25);
    }

    .btn.ghost {
      background: rgba(15, 36, 23, .8);
      color: #fffdf5;
      border: 2px solid rgba(255, 255, 255, .6);
      box-shadow: none;
      font-size: 14px;
      padding: 10px 20px;
    }

    /* ── ゴールのキラキラ ── */
    #burst {
      position: fixed;
      inset: 0;
      z-index: 90;
      pointer-events: none;
      display: none;
    }

    #burst .flash {
      position: absolute;
      inset: 0;
      background: #fff;
      opacity: 0;
      animation: gflash 1.2s ease-out forwards;
    }

    #burst i {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      animation: gspark 2.2s ease-out forwards;
    }

    @keyframes gflash {
      0% {
        opacity: 0;
      }

      15% {
        opacity: .85;
      }

      100% {
        opacity: 0;
      }
    }

    @keyframes gspark {
      0% {
        transform: translate(0, 0) scale(.2);
        opacity: 0;
      }

      20% {
        opacity: 1;
      }

      100% {
        transform: translate(var(--dx), var(--dy)) scale(1.2);
        opacity: 0;
      }
    }
  </style>
</head>

<body>

  <div id="scanUI" class="overlay hidden">
    <div class="scan-frame"></div>
    <p>「<ruby>楠永大神<rt>くすながだいじん</rt></ruby>」の<b><ruby>額<rt>がく</rt></ruby></b>にカメラを<ruby>向<rt>む</rt></ruby>けてください</p>
    <p class="note"><ruby>額<rt>がく</rt></ruby>が<ruby>枠<rt>わく</rt></ruby>いっぱいに<ruby>入<rt>はい</rt></ruby>るように。<br><ruby>影<rt>かげ</rt></ruby>が<ruby>強<rt>つよ</rt></ruby>いときは<ruby>少<rt>すこ</rt></ruby>し<ruby>角度<rt>かくど</rt></ruby>を<ruby>変<rt>か</rt></ruby>えてみてください。</p>
    <button class="btn ghost" id="helpBtn" style="display:none">うまく<ruby>写<rt>うつ</rt></ruby>らない</button>
  </div>

  <div id="finale" class="overlay hidden">
    <h2 id="finaleTitle">ここまで<ruby>連<rt>つ</rt></ruby>れてきてくれて<br>ありがとう！</h2>
    <p class="note">
      <ruby>昭和<rt>しょうわ</rt></ruby>3<ruby>年<rt>ねん</rt></ruby>、この<ruby>楠<rt>くすのき</rt></ruby>の<ruby>根<rt>ね</rt></ruby>から<ruby>白蛇<rt>しろへび</rt></ruby>が<ruby>現<rt>あらわ</rt></ruby>れたと<ruby>伝<rt>つた</rt></ruby>えられ、<ruby>人々<rt>ひとびと</rt></ruby>が<ruby>祠<rt>ほこら</rt></ruby>を<ruby>建<rt>た</rt></ruby>てました。<br>
      <ruby>戦後<rt>せんご</rt></ruby>、<ruby>飛行場<rt>ひこうじょう</rt></ruby>の<ruby>工事<rt>こうじ</rt></ruby>でこの<ruby>木<rt>き</rt></ruby>が<ruby>切<rt>き</rt></ruby>られそうになったとき、<br>
      「<ruby>巳<rt>み</rt></ruby>さんの<ruby>楠<rt>くすのき</rt></ruby>」の<ruby>物語<rt>ものがたり</rt></ruby>が、この<ruby>木<rt>き</rt></ruby>を<ruby>守<rt>まも</rt></ruby>ったのです。
    </p>
    <p class="note" id="finaleText" style="white-space:pre-line"></p>
    <a class="btn" id="oracleBtn" href="oracle.html">お<ruby>告<rt>つ</rt></ruby>げを<ruby>受<rt>う</rt></ruby>ける</a>
    <a class="btn ghost" id="endBtn" href="walk.html">さんぽ<ruby>道<rt>みち</rt></ruby>にもどる</a>
  </div>

  <div id="burst">
    <div class="flash"></div>
  </div>

  <a-scene mindar-image="imageTargetSrc: ./targets/goal_target.mind;
                uiScanning: #scanUI; uiLoading: no;
                missTolerance: 20; warmupTolerance: 3;
                filterMinCF: 0.0001; filterBeta: 0.001;" color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true; antialias: true; toneMapping: linear; exposure: 1.3"
    shadow="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <a-asset-item id="snakeModel" src="./models/shirohebi.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity light="type: hemisphere; color: #ffffff; groundColor: #7d8a80; intensity: 0.8"></a-entity>
    <a-entity light="type: ambient; color: #ffffff; intensity: 0.45"></a-entity>
    <a-entity light="type: directional; color: #fff4e0; intensity: 2.0" position="2 3 2"></a-entity>
    <a-entity light="type: directional; color: #ffe9c4; intensity: 1.1" position="0 1 -2.5"></a-entity>

    <a-entity id="target" mindar-image-target="targetIndex: 0">

      <a-ring class="halo" position="0 0 0.02" rotation="-90 0 0" radius-inner="0.1" radius-outer="0.3" visible="false"
        material="shader: flat; side: double; transparent: true; opacity: 0; color: #fff3c4"
        animation__g="property: geometry.radiusOuter; from: 0.3; to: 2.2; dur: 2000; easing: easeOutQuad; startEvents: appear"
        animation__f="property: material.opacity; from: 0.9; to: 0; dur: 2000; easing: easeOutQuad; startEvents: appear"></a-ring>

      <a-ring class="halo" position="0 0 0.02" rotation="-90 0 0" radius-inner="0.1" radius-outer="0.3" visible="false"
        material="shader: flat; side: double; transparent: true; opacity: 0; color: #ffd9e4"
        animation__g="property: geometry.radiusOuter; from: 0.3; to: 1.7; dur: 2400; delay: 400; easing: easeOutQuad; startEvents: appear"
        animation__f="property: material.opacity; from: 0.8; to: 0; dur: 2400; delay: 400; easing: easeOutQuad; startEvents: appear"></a-ring>

      <a-ring class="halo" position="0 0 0.02" rotation="-90 0 0" radius-inner="0.1" radius-outer="0.3" visible="false"
        material="shader: flat; side: double; transparent: true; opacity: 0; color: #cfe4ff"
        animation__g="property: geometry.radiusOuter; from: 0.3; to: 2.0; dur: 2800; delay: 800; easing: easeOutQuad; startEvents: appear"
        animation__f="property: material.opacity; from: 0.7; to: 0; dur: 2800; delay: 800; easing: easeOutQuad; startEvents: appear"></a-ring>

      <!-- 外側の箱が動きを担当、内側のモデルは自前のうねりだけ -->
      <a-entity id="snakeWrap" position="0 -0.2 0.1" scale="0.1 0.1 0.1" rotation="0 0 0"
        animation__pop="property: scale; from: 0.3 0.3 0.3; to: 1.5 1.5 1.5;
                        dur: 900; easing: easeOutQuad; startEvents: appear"
        animation__spin="property: rotation; from: 0 -60 0; to: 0 0 0;
                         dur: 1400; easing: easeOutQuad; startEvents: appear">
        <a-gltf-model id="snake" src="#snakeModel" animation-mixer="clip: *; loop: repeat"></a-gltf-model>
      </a-entity>

    </a-entity>
  </a-scene>

  <script>
    const snakeWrap = document.getElementById('snakeWrap');
    const snake = document.getElementById('snake');
    const target = document.getElementById('target');
    const finale = document.getElementById('finale');
    const helpBtn = document.getElementById('helpBtn');

    /* ===== ここの数字だけで見た目を調整できます ===== */
    const SNAKE_SIZE = 1.5;   // 白蛇の大きさ。はみ出すなら小さく
    const SHOW_MS = 2600;  // 出てから消えはじめるまでの時間
    const LIGHT_MS = 2600;  // 光になって消えるまでの時間

    let cleared = false;
    let snakeMats = [];

    /* ===== モデルの材質をそろえる（発光のため） ===== */
    snake.addEventListener('model-loaded', e => {
      // 入っているアニメーションの名前を確認したいときは次の行を有効にする
      // console.log(e.detail.model.animations.map(a => a.name));
      e.detail.model.traverse(o => {
        if (!o.isMesh || !o.material) return;
        const mats = Array.isArray(o.material) ? o.material : [o.material];
        mats.forEach(m => {
          if (m.emissive) m.emissive.setHex(0x333333);
          m.emissiveIntensity = 1;
          snakeMats.push(m);
        });
      });
    });

    /* ===== 光になって還る ===== */
    AFRAME.registerComponent('to-light', {
      schema: { dur: { default: 2600 } },
      init() {
        this.t = -1;
        this.el.addEventListener('tolight', () => {
          this.t = 0;
          this.s0 = this.el.object3D.scale.x;
          this.r0 = this.el.object3D.rotation.y;
        });
      },
      tick(time, dt) {
        if (this.t < 0) return;
        this.t += dt;
        const k = Math.min(this.t / this.data.dur, 1);
        const e = k * k * k;                       // 最後に一気に発光
        snakeMats.forEach(m => {
          if (m.emissive) m.emissive.setScalar(0.2 + e * 0.8);
          m.emissiveIntensity = 1 + e * 4;
        });
        const s = Math.max(this.s0 * (1 + Math.sin(k * Math.PI) * 0.12) * (1 - e), 0.0001);
        this.el.object3D.scale.set(s, s, s);
        const spin = Math.min(k / 0.7, 1);
        const q = spin * spin * (3 - 2 * spin);
        this.el.object3D.rotation.y = this.r0 + q * Math.PI * 2;
        if (k >= 1) { this.t = -1; this.el.setAttribute('visible', false); }
      }
    });
    snakeWrap.setAttribute('to-light', 'dur: ' + LIGHT_MS);

    /* ===== 光の粒 ===== */
    function motes(n = 16) {
      const root = snakeWrap.parentNode;
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2;
        const r = 0.15 + Math.random() * 0.4;
        const dur = 1400 + Math.random() * 900;
        const p = document.createElement('a-sphere');
        p.setAttribute('radius', 0.012 + Math.random() * 0.012);
        p.setAttribute('material',
          'shader: flat; color: #fff3c4; transparent: true; opacity: 0.95; depthWrite: false');
        p.setAttribute('position', `${Math.cos(a) * 0.08} -0.1 ${Math.sin(a) * 0.08}`);
        p.setAttribute('animation__up',
          `property: position; to: ${Math.cos(a) * r} ${0.7 + Math.random() * 0.8} ${Math.sin(a) * r}; dur: ${dur}; easing: easeOutQuad`);
        p.setAttribute('animation__o',
          `property: material.opacity; to: 0; dur: ${dur}; easing: easeInQuad`);
        root.appendChild(p);
        setTimeout(() => p.remove(), dur + 200);
      }
    }

    /* ===== 光の輪 ===== */
    function ripple() {
      const root = snakeWrap.parentNode;
      for (let i = 0; i < 3; i++) setTimeout(() => {
        const g = document.createElement('a-ring');
        g.setAttribute('radius-inner', 0.18);
        g.setAttribute('radius-outer', 0.21);
        g.setAttribute('rotation', '-90 0 0');
        g.setAttribute('position', '0 -0.25 0');
        g.setAttribute('material',
          'shader: flat; color: #ffe9a8; side: double; transparent: true; opacity: 0.85; depthWrite: false');
        g.setAttribute('animation__s', 'property: scale; to: 6 6 6; dur: 1500; easing: easeOutQuad');
        g.setAttribute('animation__o', 'property: material.opacity; to: 0; dur: 1500; easing: easeOutQuad');
        root.appendChild(g);
        setTimeout(() => g.remove(), 1700);
      }, i * 260);
    }

    /* ===== 効果音 ===== */
    const SE = { finale: new Audio('./audio/finale.mp3') };
    Object.values(SE).forEach(a => a.volume = 0.6);

    function se(name) {
      const a = SE[name];
      if (!a) return;
      a.currentTime = 0;
      a.play().catch(() => { });
    }

    /* ===== しるしが三つそろっているか ===== */
    const gotAll = (typeof Stamp !== 'undefined') && Stamp.count() >= CP_LIST.length;

    /* ===== 画面いっぱいのキラキラ ===== */
    function burst() {
      const box = document.getElementById('burst');
      box.style.display = 'block';
      const colors = ['#fff3c4', '#ffd9e4', '#cfe4ff', '#fffbe6'];
      for (let i = 0; i < 40; i++) {
        const s = document.createElement('i');
        const a = Math.random() * Math.PI * 2;
        const d = 120 + Math.random() * 320;
        const c = colors[i % colors.length];
        s.style.background = c;
        s.style.boxShadow = '0 0 14px 5px ' + c;
        s.style.setProperty('--dx', Math.cos(a) * d + 'px');
        s.style.setProperty('--dy', Math.sin(a) * d + 'px');
        s.style.animationDelay = (Math.random() * 0.8) + 's';
        box.appendChild(s);
      }
      setTimeout(() => {
        box.style.display = 'none';
        box.querySelectorAll('i').forEach(e => e.remove());
      }, 3200);
    }

    /* ===== 最後のメッセージ ===== */
    function showFinale() {
      finale.classList.remove('hidden');
      if (gotAll) {
        document.getElementById('finaleText').textContent =
          'しるしが 三つ そろった。\nしろへびさまが お告げを くれるそうだ。';
        document.getElementById('oracleBtn').style.display = 'inline-block';
        document.getElementById('endBtn').style.display = 'none';
      } else {
        document.getElementById('finaleText').textContent =
          'しろへびさまは 社の奥へ かえっていった。\nしるしを 三つ あつめると、お告げが きけるよ。';
        document.getElementById('oracleBtn').style.display = 'none';
        document.getElementById('endBtn').style.display = 'inline-block';
      }
    }

    /* ===== 白蛇の登場と退場 ===== */
    function clear() {
      if (cleared) return;
      cleared = true;

      // ① 登場
      document.querySelectorAll('.halo').forEach(h => h.setAttribute('visible', true));
      snakeWrap.emit('appear');
      burst();
      se('finale');

      // ② しばらく見せてから、光になって消える
      setTimeout(() => {
        ripple();
        ['animation__pop', 'animation__spin'].forEach(n => snakeWrap.removeAttribute(n));
        snakeWrap.setAttribute('scale', SNAKE_SIZE + ' ' + SNAKE_SIZE + ' ' + SNAKE_SIZE);
        snakeWrap.emit('tolight');
      }, SHOW_MS);

      // ③ 消えかけたところで光の粒
      setTimeout(motes, SHOW_MS + LIGHT_MS * 0.5);

      // ④ 最後のメッセージ
      setTimeout(showFinale, SHOW_MS + LIGHT_MS + 600);
    }

    target.addEventListener('targetFound', clear);

    // 20秒認識しなければ救済ボタンを出す（当日のトラブル対策）
    setTimeout(() => { if (!cleared) helpBtn.style.display = 'inline-block'; }, 20000);
    helpBtn.addEventListener('click', () => {
      if (confirm('額が読み取れない場合、ここでお話を先に進めます。よろしいですか？')) clear();
    });
  </script>
</body>

</html>
